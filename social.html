 <li><a href="mailto:you@example.com">Email: G@gmail.com</a></li>

    <section class="card">
      <h2>Contact Me</h2>
      <form action="#" method="post" autocomplete="on" novalidate>
        <div class="form-row">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" required minlength="3" maxlength="60" placeholder="Enter your name">
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@example.com">
        </div>
        <div class="form-row">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" placeholder="05XXXXXXXX" pattern="^05[0-9]{8}$">
          <small class="hint">Format: 05XXXXXXXX</small>
        </div>
        <div class="form-row">
          <label for="msg">Message</label>
          <textarea id="msg" name="msg" rows="5" required minlength="10" maxlength="500" placeholder="Your message here"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit">Send</button>
          <button type="reset">Reset</button>
        </div>
      </form>
    </section>
